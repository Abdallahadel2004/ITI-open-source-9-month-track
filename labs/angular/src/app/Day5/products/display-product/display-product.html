<div class="container-fluid mt-5 px-4 pb-5">
    <div class="row g-4">
        <!-- Add Product Form Section -->
        <div class="col-lg-4 col-md-5">
            <app-add-product></app-add-product>
        </div>

        <!-- Products Catalog Section -->
        <div class="col-lg-8 col-md-7">
            <div class="card card-simple p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <h2 class="m-0">Products Dashboard</h2>
                    <span class="badge bg-primary rounded-pill px-3 py-2">{{ products.length }} items</span>
                </div>

                <div class="row row-cols-1 row-cols-xl-2 g-4">
                    <div class="col" *ngFor="let product of products" appCustom>
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h5 class="card-title m-0 text-truncate pe-2">
                                        <a [routerLink]="['/about/products', product.id]"
                                            class="text-decoration-none text-primary">{{ product.name }}</a>
                                    </h5>
                                    <span class="badge bg-success px-2 py-1 fs-6">
                                        {{ product.price | currency }}
                                    </span>
                                </div>
                                <p class="card-text text-muted product-desc mb-0">
                                    {{ product.description || 'No description available for this product.' }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div *ngIf="products.length === 0" class="text-center py-5">
                    <h5 class="text-muted">No products available</h5>
                    <p class="text-muted small">Add a new product using the form on the left.</p>
                </div>
            </div>
        </div>
    </div>
</div>
