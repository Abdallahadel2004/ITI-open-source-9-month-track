<div class="card card-simple p-4 mb-4">
    <h3 class="mb-3">Add Product</h3>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input id="name" type="text" formControlName="name" class="form-control" />
            <div class="text-danger small mt-1"
                *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">
                Name is required (min 3 chars).
            </div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input id="price" type="number" formControlName="price" class="form-control" />
            <div class="text-danger small mt-1"
                *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
                Price must be greater than 0.
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" formControlName="description" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="productForm.invalid">
            Add Product
        </button>
    </form>
</div>
