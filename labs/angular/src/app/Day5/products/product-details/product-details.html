<div class="container mt-5 pt-4 d-flex justify-content-center">
    <div class="card card-simple p-5 w-100 text-center" style="max-width: 600px;" *ngIf="product; else notFound">
        <h2 class="mb-4 pb-2 border-bottom">Product Details</h2>

        <div class="mb-4 mt-2">
            <h1 class="display-5 fw-bold mb-2 text-primary">{{ product.name }}</h1>
            <span class="badge bg-success fs-5 px-3 py-2">{{ product.price | currency }}</span>
        </div>

        <div class="bg-light p-4 rounded border text-start mb-4">
            <p class="mb-2 fw-semibold">
                <i class="bi bi-info-circle-fill me-2 text-info"></i>
                Description
            </p>
            <p class="mb-0 text-muted" style="line-height: 1.6;">
                {{ product.description || 'No description available for this product.' }}
            </p>
        </div>

        <div class="bg-light p-3 rounded border text-start mb-4">
            <p class="mb-0 text-muted small">
                <strong>Product ID:</strong> {{ product.id }}
            </p>
        </div>

        <a class="btn btn-outline-primary px-4 py-2" routerLink="/about">
            <i class="bi bi-arrow-left me-2"></i> Back to Catalog
        </a>
    </div>

    <ng-template #notFound>
        <div class="card card-simple p-5 w-100 text-center" style="max-width: 600px;">
            <h2 class="mb-3 text-danger">Product Not Found</h2>
            <p class="text-muted">The product you are looking for does not exist.</p>
            <a class="btn btn-outline-primary px-4 py-2" routerLink="/about">
                <i class="bi bi-arrow-left me-2"></i> Back to Catalog
            </a>
        </div>
    </ng-template>
</div>
