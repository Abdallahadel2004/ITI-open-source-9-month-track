<div class="row mt-5">
  <div class="col-md-6 offset-md-3">
    <div class="card card-simple p-4">
      <h2 class="text-center mb-4">Login</h2>
      <form #loginForm="ngForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-control" [(ngModel)]="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="!username || !password">
          Login
        </button>
      </form>
    </div>
  </div>
</div>
