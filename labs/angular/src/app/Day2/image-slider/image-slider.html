<img [src]="currentImage" alt="Slide image" width="300" />
<br /><br />
<button style="background-color: orange;" (click)="next()">Next</button>
<button style="background-color: orange;" (click)="prev()">Prev</button>
<button style="background-color: orange;" (click)="slide()">Slide</button>
<button style="background-color: orange;" (click)="stop()">Stop</button>
