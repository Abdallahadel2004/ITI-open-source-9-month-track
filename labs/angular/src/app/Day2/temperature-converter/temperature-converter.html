<h2>Temperature Converter</h2>

<label>Celsius</label>
<br />
<input
  type="number"
  [value]="celsius"
  (input)="onCelsius($any($event.target).value)"
  placeholder="Enter Celsius"
/>

<br /><br />

<label>Fahrenheit</label>
<br />
<input
  type="number"
  [value]="fahrenheit"
  (input)="onFahrenheit($any($event.target).value)"
  placeholder="Enter Fahrenheit"
/>
