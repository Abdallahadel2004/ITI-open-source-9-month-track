{% extends 'navbar.html' %}
{% block content %}
<div class="container mt-4">
  <h1>Teachers</h1>

  <form action="{% url 'add_teacher' %}" method="post">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Name" required>
    <input type="number" name="age" placeholder="Age" required>
    <input type="number" name="salary" placeholder="Salary" step="0.01" required>
    <button type="submit" class="btn btn-primary btn-sm">Add</button>
  </form>

  <hr>

  <h5>Filter Teachers</h5>
  <form action="{% url 'teachers' %}" method="get" class="row g-2 mb-4">
    <div class="col-md-3">
      <input type="text" name="name" value="{{ request.GET.name }}" placeholder="Search by name" class="form-control form-control-sm">
    </div>
    <div class="col-md-2">
      <input type="number" name="age" value="{{ request.GET.age }}" placeholder="Age" class="form-control form-control-sm">
    </div>
    <div class="col-md-2">
      <input type="number" name="min_salary" value="{{ request.GET.min_salary }}" placeholder="Min Salary" step="0.01" class="form-control form-control-sm">
    </div>
    <div class="col-md-2">
      <input type="number" name="max_salary" value="{{ request.GET.max_salary }}" placeholder="Max Salary" step="0.01" class="form-control form-control-sm">
    </div>
    <div class="col-md-3 d-flex gap-1">
      <button type="submit" class="btn btn-secondary btn-sm flex-grow-1">Filter</button>
      <a href="{% url 'teachers' %}" class="btn btn-outline-secondary btn-sm flex-grow-1">Clear</a>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Age</th><th>Salary</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for teacher in teachers %}
      <tr>
        <td>{{ teacher.id }}</td>
        <td>{{ teacher.name }}</td>
        <td>{{ teacher.age }}</td>
        <td>{{ teacher.salary }}</td>
        <td><a href="{% url 'delete_teacher' teacher.id %}" class="btn btn-danger btn-sm">Delete</a></td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No teachers.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
